[package]
name = "NASA-APOD-Wallpaper-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
winapi = { version = "0.3", features = [
    "objbase",
    "shobjidl_core",
    "combaseapi",
    "winerror",
] }
reqwest = { version = "0.12.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
image = "0.25.5"
imageproc = "0.25.0"
ab_glyph = "0.2.29"
winit = "0.29.15"
rand = "0.9.0"
